<svg xmlns="http://www.w3.org/2000/svg" width="890" height="270" viewBox="0 0 890 270" role="img" aria-labelledby="title">
<title id="title">Интервал сходимости степенного ряда</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#253d49"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<g font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="18" fill="#253d49" stroke-linecap="round">
<line x1="30" y1="150" x2="855" y2="150" stroke="#253d49" stroke-width="2" marker-end="url(#arrow)"/><line x1="175" y1="150" x2="705" y2="150" stroke="#176b76" stroke-width="7" /><line x1="285" y1="128" x2="595" y2="128" stroke="#8564ae" stroke-width="5" /><line x1="175" y1="141" x2="175" y2="162" stroke="#253d49" stroke-width="2" /><text x="175" y="188" text-anchor="middle" fill="#253d49" font-size="18">x₀ − R</text><line x1="440" y1="141" x2="440" y2="162" stroke="#253d49" stroke-width="2" /><text x="440" y="188" text-anchor="middle" fill="#253d49" font-size="18">x₀</text><line x1="705" y1="141" x2="705" y2="162" stroke="#253d49" stroke-width="2" /><text x="705" y="188" text-anchor="middle" fill="#253d49" font-size="18">x₀ + R</text><circle cx="175" cy="150" r="7" fill="white" stroke="#176b76" stroke-width="2"/><circle cx="705" cy="150" r="7" fill="white" stroke="#176b76" stroke-width="2"/><text x="440" y="52" text-anchor="middle" fill="#176b76" font-size="18">абсолютная сходимость внутри интервала</text><text x="440" y="93" text-anchor="middle" fill="#8564ae" font-size="18">равномерная сходимость на меньшем отрезке</text><text x="88" y="113" text-anchor="middle" fill="#253d49" font-size="15">расходится</text><text x="790" y="113" text-anchor="middle" fill="#253d49" font-size="15">расходится</text><text x="440" y="233" text-anchor="middle" fill="#253d49" font-size="16">Концы интервала требуют отдельного исследования</text>
</g></svg>
