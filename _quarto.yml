project:
  type: book
  output-dir: _book
  resources:
    - assets/**

book:
  title: "Математический анализ · III семестр"
  subtitle: "Лекции 25–30: функциональные последовательности и ряды"
  author: "По рукописным записям лекций"
  repo-url: https://github.com/brawler2011/matan3
  repo-actions: [edit, issue]
  output-file: matan-sem3
  date: last-modified
  date-format: "DD.MM.YYYY"
  chapters:
    - index.qmd
    - chapters/25-26.qmd
    - chapters/27-28.qmd
    - chapters/29-30.qmd
    - changes.qmd
  downloads: [pdf]
  sidebar:
    style: docked
    search: true
  page-footer:
    left: "Конспект лекций 25–30"
    right:
      - text: "История изменений"
        href: changes.qmd

lang: ru
toc: true
number-sections: true
crossref:
  chapters: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    html-math-method: mathjax
  typst:
    template-partials:
      - templates/typst-show.typ
    papersize: a4
    mainfont: "Noto Serif"
    fontsize: 11pt
    margin:
      x: 22mm
      y: 22mm
    toc-depth: 2
